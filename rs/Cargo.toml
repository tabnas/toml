[package]
name = "tabnas-toml"
version = "0.5.8"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The TOML grammar plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/toml"

[lib]
name = "tabnas_toml"
path = "src/lib.rs"

[dependencies]
# The engine and the relaxed-JSON base grammar are consumed as SIBLING
# CHECKOUTS, the standard tabnas development model: clone
# https://github.com/tabnas/parser and https://github.com/tabnas/jsonic
# next to this repo. Neither crate is published, so there is no registry
# version to fall back on.
#
# Clone https://github.com/tabnas/json as well. It gets no entry here,
# because it is tabnas-jsonic that depends on it, but cargo reads the
# whole manifest graph before it compiles anything, so without that
# checkout nothing here resolves.
tabnas = { path = "../../parser/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
indexmap = "2"
regex = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader, runner and divergence register: one loader in
# three languages, so the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
